[project]
name = "bird-id-project"
version = "0.1.0"
description = "Bird species audio classification application"
readme = "README.md"
authors = [
    { name = "mustafa.digital", email = "124535608+mustafa-digital@users.noreply.github.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "audioread==3.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "colorama==0.4.6",
    "decorator==5.3.1",
    "deepagents>=0.7.12",
    "exceptiongroup==1.3.1",
    "fastapi==0.141.1",
    "filelock==3.29.0",
    "fsspec==2026.4.0",
    "groq>=0.30,<1",
    "h11==0.16.0",
    "httpcore2==2.5.0",
    "httpx2==2.5.0",
    "idna==3.18",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "lazy-loader==0.5",
    "librosa==0.11.0",
    "llvmlite==0.48.0",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "msgpack==1.2.1",
    "narwhals==2.24.0",
    "networkx==3.6.1",
    "numba==0.66.0",
    "numpy==2.4.6",
    "packaging==26.0",
    "pip==26.1.2",
    "platformdirs==4.11.1",
    "pluggy==1.6.0",
    "pooch==1.9.0",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.15.0",
    "pygments==2.20.0",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "python-json-logger==4.1.0",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "sentence-transformers>=6.0.1",
    "setuptools==78.1.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "starlette==1.6.0",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tomli==2.4.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchlibrosa==0.1.0",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "uv==0.12.5",
    "uvicorn==0.52.1",
    "wheel==0.47.0",
]

[project.scripts]
bird-id-project = "bird_id_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
log_cli = false
log_level = "CRITICAL"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
